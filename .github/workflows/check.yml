name: Zara restock check

# BACKUP ONLY: the every-minute watcher runs on Cloudflare (cloudflare/worker.js).
# This runs only when started by hand (Actions → Run workflow).
# To make it the main checker again, add back:
#   schedule:
#     - cron: "4,19,34,49 * * * *"

on:
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Only send a test notification"
        type: boolean
        default: false

permissions:
  contents: write   # lets the run save state.json back to the repo

concurrency:
  group: zara-restock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REMIND_EVERY_MIN: "5"
          CHECKS_PER_RUN: "1"
          TEST_NOTIFY: ${{ inputs.test_notify && 'yes' || '' }}
        run: |
          if [ -n "$TEST_NOTIFY" ]; then exec python3 check.py --test-notify; fi
          rc=0
          for i in $(seq 1 "$CHECKS_PER_RUN"); do
            echo "--- check $i/$CHECKS_PER_RUN $(date -u +%H:%M:%S) UTC"
            python3 check.py || rc=1
            if [ "$i" -lt "$CHECKS_PER_RUN" ]; then sleep 60; fi
          done
          exit $rc

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update watcher state"
            git pull --rebase --quiet   # in case items.json was edited meanwhile
            git push
          fi
